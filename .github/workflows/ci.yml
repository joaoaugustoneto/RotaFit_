name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Verificação de Tipos e Testes
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rotafit

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: 'rotafit/pnpm-lock.yaml'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checagem de Tipos (TypeScript)
        run: pnpm typecheck

      - name: Testes Unitários e Testes de Banco (Jest + PGlite)
        run: pnpm test
